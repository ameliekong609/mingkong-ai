<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1584, initial-scale=1" />
    <title>Dr Ming Kong LinkedIn Banner</title>
    <link rel="stylesheet" href="./linkedin-banner.css" />
  </head>
  <body>
    <main class="banner" aria-label="LinkedIn banner for Dr Ming Kong">
      <div class="grid-lines" aria-hidden="true"></div>
      <div class="top-left-structure" aria-hidden="true"></div>
      <div class="system-plane" aria-hidden="true"></div>
      <svg class="background-sketch" viewBox="0 0 1584 396" aria-hidden="true">
        <path d="M322 320 H494 C536 320 548 292 590 292 H846 C886 292 902 318 942 318 H1512" />
        <path d="M382 74 H666 C706 74 724 96 764 96 H974" />
        <path d="M1018 54 C1078 84 1088 150 1042 204 C1008 244 1022 298 1084 332" />
        <circle cx="494" cy="320" r="3.5" />
        <circle cx="846" cy="292" r="3.5" />
        <circle cx="942" cy="318" r="3.5" />
        <circle cx="666" cy="74" r="3.5" />
      </svg>
      <div class="safe-zone" aria-hidden="true"></div>

      <section class="copy" aria-label="Positioning">
        <h1>
          <span>Enterprise AI</span>
          <span>shouldn&rsquo;t stop</span>
          <span>at workflows.</span>
        </h1>
        <p class="second-line">
          <span>It should deploy</span>
          <span>controlled digital workers.</span>
        </p>
        <p class="disciplines">
          <span>Agentic AI</span>
          <span aria-hidden="true">•</span>
          <span>Multi-Agent Systems</span>
          <span aria-hidden="true">•</span>
          <span>Enterprise RAG</span>
          <span aria-hidden="true">•</span>
          <span>Production AI</span>
        </p>
      </section>

      <section class="architecture" aria-label="Controlled digital worker architecture sketch">
        <svg viewBox="0 0 620 318" role="img" aria-labelledby="architecture-title">
          <title id="architecture-title">Objective to controlled release architecture sketch</title>
          <defs>
            <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow
                dx="0"
                dy="18"
                stdDeviation="18"
                flood-color="#cbd5e1"
                flood-opacity="0.34"
              />
            </filter>
          </defs>

          <path class="rail" d="M310 28 C310 76 310 116 310 152 C310 190 310 232 310 292" />
          <path class="branch branch-a" d="M310 130 C282 130 264 130 238 130" />
          <path class="branch branch-b" d="M310 230 C344 230 366 230 392 230" />
          <path class="return-loop" d="M445 246 C514 246 530 175 468 150 C438 138 416 132 386 132" />

          <g class="node node-primary" transform="translate(212 10)" filter="url(#soft-shadow)">
            <rect width="196" height="42" rx="12" />
            <text x="98" y="27">Objective</text>
          </g>

          <g class="node" transform="translate(206 65)" filter="url(#soft-shadow)">
            <rect width="208" height="42" rx="12" />
            <text x="104" y="27">Investigation</text>
          </g>

          <g class="node node-soft" transform="translate(42 109)">
            <rect width="196" height="42" rx="12" />
            <text x="98" y="27">Tool Use</text>
          </g>

          <g class="node" transform="translate(212 164)" filter="url(#soft-shadow)">
            <rect width="196" height="42" rx="12" />
            <text x="98" y="27">Evidence</text>
          </g>

          <g class="node node-soft" transform="translate(392 209)">
            <rect width="186" height="42" rx="12" />
            <text x="93" y="27">Review</text>
          </g>

          <g class="node node-release" transform="translate(174 266)" filter="url(#soft-shadow)">
            <rect width="272" height="42" rx="12" />
            <text x="136" y="27">Controlled Release</text>
          </g>

          <circle class="junction" cx="310" cy="86" r="3.8" />
          <circle class="junction" cx="310" cy="130" r="3.8" />
          <circle class="junction" cx="310" cy="185" r="3.8" />
          <circle class="junction" cx="310" cy="230" r="3.8" />
          <circle class="junction junction-soft" cx="468" cy="150" r="3.4" />
        </svg>
      </section>

      <p class="site">mingkong.ai</p>
    </main>
  </body>
</html>
