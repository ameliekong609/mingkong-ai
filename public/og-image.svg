
<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="0.58" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FF"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" stroke="#2563EB" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="30" flood-color="#CBD5E1" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <rect x="62" y="56" width="1076" height="518" rx="30" fill="#FFFFFF" fill-opacity="0.82" stroke="#D7E4F5" filter="url(#softShadow)"/>

  <g transform="translate(0 86)">
    <rect x="526" y="0" width="58" height="58" rx="11" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="555" y="38" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="750" fill="#1D4ED8">MK</text>
    <text x="600" y="24" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750" fill="#020617">Dr Ming Kong</text>
    <text x="600" y="53" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="550" fill="#64748B">Enterprise Applied AI | Agentic Systems</text>
  </g>

  <text x="600" y="262" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="67" font-weight="780" letter-spacing="-1.2" fill="#020617">
    <tspan x="600" y="262">Controlled digital workers</tspan>
    <tspan x="600" y="342">for enterprise AI.</tspan>
  </text>

  <rect x="260" y="385" width="680" height="2" rx="1" fill="#2563EB" opacity="0.22"/>
  <text x="600" y="430" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="520" fill="#1E293B">
    <tspan x="600" y="430">Systems that investigate, use evidence, review,</tspan>
    <tspan x="600" y="468">and release work under human governance.</tspan>
  </text>

  <g transform="translate(252 506)">
    <rect x="0" y="0" width="196" height="46" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="98" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="720" fill="#1D4ED8">Investigate</text>
    <rect x="216" y="0" width="196" height="46" rx="10" fill="#FFFFFF" stroke="#D7E4F5"/>
    <text x="314" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="720" fill="#0F172A">Review</text>
    <rect x="432" y="0" width="196" height="46" rx="10" fill="#FFFFFF" stroke="#D7E4F5"/>
    <text x="530" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="720" fill="#0F172A">Approve</text>
    <rect x="648" y="0" width="196" height="46" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="746" y="30" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="720" fill="#1D4ED8">Release</text>
  </g>

  <text x="600" y="594" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="760" fill="#1D4ED8">mingkong.ai</text>
</svg>